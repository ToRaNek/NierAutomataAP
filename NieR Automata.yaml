# NieR:Automata (Archipelago) - YAML template
name: YourName
game: NieR:Automata
description: NieR:Automata

NieR:Automata:
  # Goal, which also sets how much of the game has checks:
  #   story_progress (finish chapter story_chapter of route story_route), ending_a, ending_b (routes A+B),
  #   ending_cd (route C/D), ending_e.
  goal: story_progress
  # For story_progress: the route (a, b or cd) and the chapter to finish (1-10 in routes a and b, 11-17 in cd).
  # Every part of every chapter up to it is a "Story A 02-01: Landing at the City Ruins" check, and only the
  # areas opened by then have checks. a + 4 = a short game ending at the Amusement Park.
  story_route: a
  story_chapter: 4
  # Every chest is a check named after its area ("Chest: City Ruins #12").
  chest_checks: true
  # "AP Item" objects on the ground at the game's collection points ("AP Item: Desert Zone #2"), 1-8 per area.
  ap_items: true
  ap_items_per_area: 3
  # First activation of each access point ("Access Point: Desert: Camp").
  access_point_checks: true
  # Side quests ("Quest: Lost Girl"). Quests that can be missed never hold an important item.
  quest_checks: true
  # Main endings reached before the goal ("Ending A", "Ending B"...). The goal ending itself is not a check.
  ending_checks: true
  # AP Items sold at the top of the shops (Camp, Pascal's Village, Castle) and their price.
  shop_checks: 2
  shop_price: 300
  # One check per level, from 2 up to this level (never above the level expected in the covered chapters).
  max_level_check: 20
  # Weapons found in the game (removed from the inventory, send a check).
  weapon_checks: 8
  # Abilities locked until received (add "Pod Fire", "Pod Program" for a pod-less start).
  randomized_abilities: ["Double Jump", "Air Dash", "Ground Evade"]
  # Six areas (Desert, Park, Pascal's Village, Forest, Flooded City, Factory) are closed until you receive
  # their Pass; only the areas played before your goal get one.
  area_locks: true
  # Route B needs "Route B Access" and route C/D needs "Route C/D Access" (only used past ending A).
  route_locks: true
  # Routes B and C/D: each big chapter after the first needs one more "B Chapter Key" / "C/D Chapter Key".
  chapter_locks: true
  # The 16 Pod programs other than the starting laser are items found in the multiworld.
  pod_programs: true
  # Programs found in the game itself send a check and are taken back, like weapons (0-16, 0 = off).
  pod_program_checks: 4
  # Start with a few healing items and one attack and one defense boost (the early game is the hardest part).
  starter_kit: true
  # Percentage of traps among filler items.
  trap_percentage: 20
  # Max HP removed by a Damage Trap (5-50; a Heavy Damage Trap removes twice as much, never kills).
  damage_trap_percent: 20
  # true: a damage trap kills you when it removes more HP than you have left (false: 1 HP at worst).
  lethal_traps: false
  # Enemy Trap: basic (small machines only) or random (small machines plus the area's medium machines).
  enemy_trap_enemies: basic
  # First pickup of each material = one check (many checks).
  item_checks: false
  death_link: false
