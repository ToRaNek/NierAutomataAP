# NieR:Automata (Archipelago) - YAML template
name: YourName
game: NieR:Automata
description: NieR:Automata - route A

NieR:Automata:
  # Goal: story_progress (reach story_checks story steps) or ending_a (Ending A).
  goal: story_progress
  # Story steps giving a "Story: <place>" check (1-27). With story_progress it is also the goal.
  story_checks: 12
  # Weapons found (removed from the inventory, send a check).
  weapon_checks: 8
  # Chests opened.
  chest_checks: 15
  # One check per level, from 2 up to this level (0 = off).
  max_level_check: 20
  # AP Items dropped on the ground along your path ("AP Item: <place> #k").
  ap_items: true
  ap_items_per_phase: 2
  # AP Items sold at the top of the shops (Camp, Pascal's Village, Castle) and their price.
  shop_checks: 2
  shop_price: 300
  # Abilities locked until received (add "Pod Fire", "Pod Program" for a pod-less start).
  randomized_abilities: ["Double Jump", "Air Dash", "Ground Evade"]
  # Percentage of traps among filler items.
  trap_percentage: 20
  # First pickup of each material = one check (many checks).
  item_checks: false
  death_link: false
